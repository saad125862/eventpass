name: Release watch

# Render deploys a commit only after ALL GitHub checks on it pass (autoDeployTrigger: checksPass).
# A workflow that waited for the deploy would therefore deadlock with Render (it would be a check
# that Render waits on, while it waits on Render). So verification is a short, non-blocking watcher:
# it runs on a schedule (and on demand), checks the live site, and compares the live version with
# main. It fails only if the site is unhealthy, or main has not been released after 30 minutes.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: https://eventpass-36j5.onrender.com

jobs:
  watch:
    name: Check live release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Health and version
        run: |
          # The free instance sleeps when idle; the first request may take about a minute to wake it.
          body=$(curl -fsS --retry 3 --retry-delay 10 --max-time 90 "$SITE_URL/health") || {
            echo "::error::Live site did not answer /health"; exit 1; }
          echo "$body"
          echo "$body" | grep -q '"status":"ok"' || { echo "::error::Site is reporting a degraded status"; exit 1; }

          live=$(echo "$body" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
          head="$(git rev-parse HEAD)"
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))

          if [ "$live" = "$head" ]; then
            echo "Release $head is live and healthy."
          elif [ "$age" -lt 1800 ]; then
            echo "::notice::Live is on ${live:0:7}; main (${head:0:7}) is only $((age / 60)) min old, so a deploy is probably still in progress."
          else
            echo "::error::main (${head:0:7}) is $((age / 60)) min old but live is still ${live:0:7}. The deploy failed or was skipped; check Render."
            exit 1
          fi

      - name: Smoke test key pages
        run: |
          for path in / /events /login /up; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$SITE_URL$path")
            echo "$code $path"
            [ "$code" = "200" ] || exit 1
          done
