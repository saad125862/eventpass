name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ---------------------------------------------------------------- quality gates
  quality:
    name: Lint, static analysis, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, gd, zip
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Dependency audit
        run: composer audit --no-dev

      - name: Tests with coverage gate
        run: php artisan test --coverage --min=80

  # ------------------------------------------------- real-database concurrency test
  concurrency:
    name: Concurrency test (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eventpass
          POSTGRES_PASSWORD: eventpass
          POSTGRES_DB: eventpass_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eventpass"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: eventpass_test
      DB_USERNAME: eventpass
      DB_PASSWORD: eventpass
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql, gd, zip
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Full suite on PostgreSQL (50 racing buyers, 10 tickets)
        run: php artisan test

  # ------------------------------------------------------------- container build
  docker:
    name: Build image, scan, smoke test
    needs: [quality, concurrency]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: eventpass:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vulnerability scan (Trivy, critical and fixable only)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: eventpass:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke test (all Linux capabilities dropped, like Render)
        run: |
          docker run -d --name eventpass --cap-drop=ALL -p 8080:8080 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=:memory: \
            -e SESSION_DRIVER=array -e CACHE_STORE=array \
            eventpass:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health | tee /tmp/health.json | grep -q '"status":"ok"'; then
              echo "Container is healthy: $(cat /tmp/health.json)"
              grep -q '"version":"${{ github.sha }}"' /tmp/health.json && echo "Version matches commit"
              exit 0
            fi
            sleep 2
          done
          echo "Container failed to become healthy"; docker logs eventpass; exit 1

  # ------------------------------------------------ publish image to the registry
  publish:
    name: Publish image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (immutable sha tag + latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
